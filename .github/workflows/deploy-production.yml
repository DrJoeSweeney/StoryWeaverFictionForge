name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: writeforge/frontend/package-lock.json

      - name: Build Frontend
        working-directory: writeforge/frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Production
        run: |
          echo "Production deploy step goes here"
          echo "This could push to VPS, AWS, Vercel, etc."
          # Example: rsync, docker compose up, etc.
